[package]
name = "exact_number"
version = "0.1.0"
edition = "2024"

[dependencies]
# "0.3.0" has a fatal bug that makes it think √(2+√2) - √(2-√2) = 0
algebraics = { git = "https://github.com/hayashi-stl/algebraics" }
approx = "0.5.1"
malachite = "0.6.1"
nalgebra = "0.34.1"
num = "0.4.3"
peg = "0.8.5"
simba = "0.9.1"

[dev-dependencies]
criterion = "0.7.0"

[[bench]]
name = "benchmark"
harness = false

[package.metadata.docs.rs]
rustdoc-args = [ "--html-in-header", "./src/docs-header.html" ]
